<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Granja Aventura: una granjita interactiva. Cuida a los animales, recoge estrellas y vive el día y la noche en el campo.">
    <meta name="theme-color" content="#7cc36a">
    <title>Granja Aventura 🐮 | Victor del Rosal</title>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Victor del Rosal">
    <meta property="og:url" content="https://victordelrosal.com/GranjaAventura">
    <meta property="og:title" content="Granja Aventura 🐮">
    <meta property="og:description" content="Una granjita interactiva. Toca a los animales, recoge estrellas y vive el día y la noche en el campo.">
    <meta property="og:image" content="https://victordelrosal.com/favicon.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Granja Aventura 🐮">
    <meta name="twitter:description" content="Una granjita interactiva. Toca a los animales, recoge estrellas y vive el día y la noche en el campo.">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            --sky-day-top: #8fd0ff;
            --sky-day-bot: #d9f2ff;
            --sky-night-top: #10193a;
            --sky-night-bot: #2a3a6b;
            --grass: #7cc36a;
            --grass-dark: #5fa851;
            --ink: #2b2f38;
            --card: rgba(255,255,255,0.85);
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font);
            color: var(--ink);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            background: var(--sky-day-bot);
            transition: background 1.2s ease;
            user-select: none;
        }

        /* ---------- Scene ---------- */
        .scene {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--sky-day-top) 0%, var(--sky-day-bot) 100%);
            transition: background 1.2s ease;
            z-index: 0;
        }
        body.night .sky {
            background: linear-gradient(180deg, var(--sky-night-top) 0%, var(--sky-night-bot) 100%);
        }

        .celestial {
            position: absolute;
            top: 8%;
            right: 12%;
            font-size: clamp(2.6rem, 9vw, 4.2rem);
            transition: transform 1.2s ease, opacity 1.2s ease;
            filter: drop-shadow(0 0 18px rgba(255,220,120,0.6));
            z-index: 1;
        }
        body.night .celestial { filter: drop-shadow(0 0 18px rgba(200,220,255,0.5)); }

        .stars {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s ease;
            z-index: 1;
            pointer-events: none;
        }
        body.night .stars { opacity: 1; }
        .star-dot {
            position: absolute;
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:1} }

        .cloud {
            position: absolute;
            font-size: clamp(2rem, 7vw, 3.4rem);
            opacity: .95;
            z-index: 1;
            animation: drift linear infinite;
            transition: opacity 1.2s ease;
        }
        body.night .cloud { opacity: .25; }
        @keyframes drift {
            from { transform: translateX(-20vw); }
            to   { transform: translateX(120vw); }
        }

        .hills {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 46%;
            background:
                radial-gradient(120% 120% at 20% 100%, var(--grass) 60%, transparent 61%),
                radial-gradient(120% 120% at 80% 100%, var(--grass-dark) 60%, transparent 61%),
                var(--grass);
            border-top-left-radius: 50% 22%;
            border-top-right-radius: 50% 22%;
            z-index: 1;
            transition: filter 1.2s ease;
        }
        body.night .hills { filter: brightness(0.62) saturate(0.9); }

        .barn {
            position: absolute;
            bottom: 34%;
            left: 6%;
            font-size: clamp(2.4rem, 9vw, 4rem);
            z-index: 2;
            transition: filter 1.2s ease;
        }
        body.night .barn { filter: brightness(0.75); }

        /* ---------- HUD ---------- */
        .hud {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: .5rem;
            padding: max(0.9rem, env(safe-area-inset-top)) 0.9rem 0.5rem;
        }
        .title {
            background: var(--card);
            backdrop-filter: blur(6px);
            padding: .5rem .85rem;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
        }
        .title h1 {
            font-size: clamp(1rem, 4.4vw, 1.35rem);
            letter-spacing: -.02em;
            line-height: 1;
        }
        .title p {
            font-size: .68rem;
            opacity: .6;
            margin-top: .2rem;
            font-weight: 500;
        }
        .stats {
            display: flex;
            gap: .4rem;
        }
        .chip {
            background: var(--card);
            backdrop-filter: blur(6px);
            padding: .5rem .7rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: .95rem;
            box-shadow: 0 6px 20px rgba(0,0,0,.12);
            display: flex;
            align-items: center;
            gap: .25rem;
            min-width: 3.2rem;
            justify-content: center;
        }
        .chip.pop { animation: chipPop .4s ease; }
        @keyframes chipPop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }

        /* ---------- Animals field ---------- */
        .field {
            position: relative;
            z-index: 4;
            margin-top: auto;
            padding: 0 0.8rem calc(1rem + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
            gap: .7rem;
            max-width: 720px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .animal {
            position: relative;
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 22px;
            background: var(--card);
            backdrop-filter: blur(6px);
            box-shadow: 0 8px 22px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.6);
            font-size: clamp(2.2rem, 10vw, 3.1rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .12s ease, box-shadow .2s ease;
            touch-action: manipulation;
        }
        .animal:active { transform: scale(.9); }
        .animal .emoji { display: block; transition: transform .2s ease; }
        .animal.happy .emoji { animation: hop .5s ease; }
        @keyframes hop {
            0%,100%{ transform: translateY(0) rotate(0); }
            30%{ transform: translateY(-30%) rotate(-8deg); }
            60%{ transform: translateY(0) rotate(6deg); }
        }
        .animal .label {
            position: absolute;
            bottom: 6px;
            font-size: .62rem;
            font-weight: 700;
            opacity: .55;
            letter-spacing: .01em;
        }
        .animal .badge {
            position: absolute;
            top: -6px; right: -6px;
            background: #ff6b6b;
            color: #fff;
            font-size: .62rem;
            font-weight: 800;
            min-width: 18px; height: 18px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-shadow: 0 3px 8px rgba(0,0,0,.2);
        }
        .animal.hungry .badge { display: flex; animation: wobble 1.4s ease-in-out infinite; }
        @keyframes wobble { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
        .animal.hungry { box-shadow: 0 8px 22px rgba(255,107,107,.35), inset 0 1px 0 rgba(255,255,255,.6); }

        /* speech bubble */
        .say {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translate(-50%, -6px);
            background: #fff;
            color: var(--ink);
            padding: .18rem .5rem;
            border-radius: 12px;
            font-size: .72rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 5px 14px rgba(0,0,0,.18);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
            z-index: 3;
        }
        .say.show { opacity: 1; transform: translate(-50%, -12px); }

        /* floating reward */
        .float {
            position: fixed;
            z-index: 30;
            font-weight: 800;
            font-size: 1.1rem;
            pointer-events: none;
            animation: floatUp 1s ease forwards;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(.6); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-60px) scale(1.1); }
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            position: relative;
            z-index: 5;
            display: flex;
            gap: .5rem;
            justify-content: center;
            flex-wrap: wrap;
            padding: .2rem 0.8rem 0;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
        }
        .tool {
            border: none;
            border-radius: 30px;
            padding: .6rem 1rem;
            font-family: var(--font);
            font-weight: 700;
            font-size: .85rem;
            cursor: pointer;
            background: var(--card);
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 18px rgba(0,0,0,.14);
            transition: transform .1s ease, background .2s ease;
            display: flex;
            align-items: center;
            gap: .35rem;
            color: var(--ink);
        }
        .tool:active { transform: scale(.94); }
        .tool.primary { background: #ffd34d; }
        .tool.on { background: #7cc36a; color:#fff; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(1.2rem + env(safe-area-inset-bottom));
            transform: translate(-50%, 120%);
            background: var(--ink);
            color: #fff;
            padding: .7rem 1.1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: .9rem;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
            z-index: 40;
            transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { transform: translate(-50%, 0); }

        /* ---------- Intro card ---------- */
        .intro {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(10,20,40,.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            transition: opacity .4s ease;
        }
        .intro.hide { opacity: 0; pointer-events: none; }
        .intro-card {
            background: #fff;
            border-radius: 28px;
            padding: 1.6rem 1.4rem;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,.35);
        }
        .intro-card .big { font-size: 3rem; }
        .intro-card h2 { margin: .5rem 0 .3rem; font-size: 1.5rem; letter-spacing: -.02em; }
        .intro-card p { font-size: .92rem; opacity: .7; line-height: 1.5; margin-bottom: 1.1rem; }
        .intro-card button {
            border: none;
            background: #7cc36a;
            color: #fff;
            font-family: var(--font);
            font-weight: 800;
            font-size: 1.05rem;
            padding: .8rem 1.6rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124,195,106,.5);
            transition: transform .1s ease;
        }
        .intro-card button:active { transform: scale(.95); }

        .credit {
            position: relative;
            z-index: 5;
            text-align: center;
            font-size: .68rem;
            opacity: .5;
            padding: .4rem 0 calc(.4rem + env(safe-area-inset-bottom));
        }
        .credit a { color: inherit; }

        @media (min-width: 600px) {
            .animal { font-size: 3.1rem; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sky"></div>
        <div class="stars" id="stars"></div>
        <div class="celestial" id="celestial">☀️</div>
        <div class="cloud" style="top:14%; animation-duration:60s;">☁️</div>
        <div class="cloud" style="top:24%; animation-duration:90s; animation-delay:-30s;">☁️</div>
        <div class="hills"></div>
        <div class="barn">🏚️</div>

        <!-- HUD -->
        <div class="hud">
            <div class="title">
                <h1>Granja Aventura 🐮</h1>
                <p>Toca a los animales para cuidarlos</p>
            </div>
            <div class="stats">
                <div class="chip" id="starChip">⭐ <span id="stars-count">0</span></div>
                <div class="chip" id="eggChip">🥚 <span id="eggs-count">0</span></div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="tool primary" id="feedBtn">🌾 Alimentar a todos</button>
            <button class="tool" id="dayBtn">🌙 Anochecer</button>
            <button class="tool" id="resetBtn">🔄 Reiniciar</button>
        </div>

        <!-- Field of animals -->
        <div class="field" id="field"></div>

        <div class="credit">
            Hecho con cariño · <a href="/">victordelrosal.com</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Intro -->
    <div class="intro" id="intro">
        <div class="intro-card">
            <div class="big">🐮🐔🐷</div>
            <h2>Granja Aventura</h2>
            <p>Bienvenido a la granja. Toca a cada animal para saludarlo, dale de comer cuando tenga hambre 🍽️ y recoge estrellas ⭐ y huevos 🥚 en tu aventura.</p>
            <button id="startBtn">¡A jugar! 🚜</button>
        </div>
    </div>

    <script>
    (function () {
        "use strict";

        var ANIMALS = [
            { key: "vaca",    emoji: "🐮", name: "Vaca",    sound: "¡Muuu!",   reward: "milk" },
            { key: "gallina", emoji: "🐔", name: "Gallina", sound: "¡Cocorocó!", reward: "egg" },
            { key: "cerdo",   emoji: "🐷", name: "Cerdo",   sound: "¡Oink!",   reward: "star" },
            { key: "oveja",   emoji: "🐑", name: "Oveja",   sound: "¡Beee!",   reward: "star" },
            { key: "caballo", emoji: "🐴", name: "Caballo", sound: "¡Iiih!",   reward: "star" },
            { key: "pato",    emoji: "🦆", name: "Pato",    sound: "¡Cuac!",   reward: "star" },
            { key: "conejo",  emoji: "🐰", name: "Conejo",  sound: "¡Boing!",  reward: "star" },
            { key: "cabra",   emoji: "🐐", name: "Cabra",   sound: "¡Meee!",   reward: "star" }
        ];

        var STORE_KEY = "granja-aventura-v1";
        var field = document.getElementById("field");
        var starsCountEl = document.getElementById("stars-count");
        var eggsCountEl = document.getElementById("eggs-count");
        var starChip = document.getElementById("starChip");
        var eggChip = document.getElementById("eggChip");
        var toastEl = document.getElementById("toast");
        var dayBtn = document.getElementById("dayBtn");
        var feedBtn = document.getElementById("feedBtn");
        var resetBtn = document.getElementById("resetBtn");
        var celestial = document.getElementById("celestial");
        var intro = document.getElementById("intro");
        var startBtn = document.getElementById("startBtn");

        var state = load() || { stars: 0, eggs: 0, night: false };
        var toastTimer = null;

        // Deterministic pseudo-random hunger so it's playful but stable per session load
        var seed = 1;
        function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

        function load() {
            try { return JSON.parse(localStorage.getItem(STORE_KEY)); }
            catch (e) { return null; }
        }
        function save() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        function updateStats(popEl) {
            starsCountEl.textContent = state.stars;
            eggsCountEl.textContent = state.eggs;
            if (popEl) {
                popEl.classList.remove("pop");
                void popEl.offsetWidth;
                popEl.classList.add("pop");
            }
        }

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
        }

        function floatReward(x, y, text, color) {
            var f = document.createElement("div");
            f.className = "float";
            f.textContent = text;
            f.style.left = x + "px";
            f.style.top = y + "px";
            f.style.color = color || "#ffb300";
            document.body.appendChild(f);
            setTimeout(function () { f.remove(); }, 1000);
        }

        function starfield() {
            var box = document.getElementById("stars");
            for (var i = 0; i < 40; i++) {
                var s = document.createElement("div");
                s.className = "star-dot";
                s.style.left = (rnd() * 100) + "%";
                s.style.top = (rnd() * 55) + "%";
                s.style.animationDelay = (rnd() * 3) + "s";
                box.appendChild(s);
            }
        }

        function buildAnimals() {
            ANIMALS.forEach(function (a) {
                var btn = document.createElement("button");
                btn.className = "animal";
                btn.setAttribute("aria-label", a.name);
                btn.dataset.key = a.key;

                var say = document.createElement("span");
                say.className = "say";

                var em = document.createElement("span");
                em.className = "emoji";
                em.textContent = a.emoji;

                var label = document.createElement("span");
                label.className = "label";
                label.textContent = a.name;

                var badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = "🍽️";

                btn.appendChild(say);
                btn.appendChild(em);
                btn.appendChild(label);
                btn.appendChild(badge);
                field.appendChild(btn);

                // random initial hunger
                if (rnd() < 0.35) btn.classList.add("hungry");

                btn.addEventListener("click", function (e) { interact(a, btn, say, em, e); });
            });
        }

        function interact(a, btn, say, em, e) {
            var rect = btn.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;

            btn.classList.add("happy");
            setTimeout(function () { btn.classList.remove("happy"); }, 500);

            if (btn.classList.contains("hungry")) {
                // Feed it -> earns a reward
                btn.classList.remove("hungry");
                say.textContent = "¡Ñam! " + a.sound;
                grantReward(a, cx, cy);
            } else {
                say.textContent = a.sound;
                // small chance a happy greeting drops a star
                if (rnd() < 0.25) {
                    state.stars += 1;
                    updateStats(starChip);
                    floatReward(cx, cy, "+1⭐", "#ffb300");
                    save();
                } else {
                    floatReward(cx, cy, "❤️", "#ff6b6b");
                }
            }

            say.classList.add("show");
            setTimeout(function () { say.classList.remove("show"); }, 1100);
        }

        function grantReward(a, cx, cy) {
            if (a.reward === "egg") {
                state.eggs += 1;
                updateStats(eggChip);
                floatReward(cx, cy, "+1🥚", "#e0a341");
                toast(a.name + " puso un huevo 🥚");
            } else if (a.reward === "milk") {
                state.stars += 2;
                updateStats(starChip);
                floatReward(cx, cy, "+2⭐", "#ffb300");
                toast("La vaca te dio leche fresca 🥛 (+2⭐)");
            } else {
                state.stars += 1;
                updateStats(starChip);
                floatReward(cx, cy, "+1⭐", "#ffb300");
                toast(a.name + " está feliz ⭐");
            }
            save();
            checkMilestones();
        }

        var lastMilestone = 0;
        function checkMilestones() {
            var m = Math.floor(state.stars / 10) * 10;
            if (m > 0 && m !== lastMilestone && state.stars >= m) {
                lastMilestone = m;
                toast("🎉 ¡" + m + " estrellas! Eres un gran granjero.");
            }
        }

        function feedAll() {
            var hungry = field.querySelectorAll(".animal.hungry");
            if (!hungry.length) {
                toast("Ningún animal tiene hambre ahora 😊");
                return;
            }
            var count = 0;
            hungry.forEach(function (btn) {
                var key = btn.dataset.key;
                var a = ANIMALS.filter(function (x) { return x.key === key; })[0];
                var rect = btn.getBoundingClientRect();
                btn.classList.remove("hungry");
                btn.classList.add("happy");
                setTimeout(function () { btn.classList.remove("happy"); }, 500);
                grantReward(a, rect.left + rect.width / 2, rect.top + rect.height / 2);
                count++;
            });
            toast("Alimentaste a " + count + " animal" + (count > 1 ? "es" : "") + " 🌾");
        }

        function setNight(night) {
            state.night = night;
            document.body.classList.toggle("night", night);
            celestial.textContent = night ? "🌙" : "☀️";
            dayBtn.textContent = night ? "☀️ Amanecer" : "🌙 Anochecer";
            dayBtn.classList.toggle("on", night);
            save();
            // At night, animals get sleepy and hungry again by morning
            if (!night) sprinkleHunger();
        }

        function sprinkleHunger() {
            field.querySelectorAll(".animal").forEach(function (btn) {
                if (rnd() < 0.4) btn.classList.add("hungry");
            });
            toast("¡Buenos días! Algunos animales tienen hambre 🍽️");
        }

        // ---- wire up ----
        feedBtn.addEventListener("click", feedAll);
        dayBtn.addEventListener("click", function () { setNight(!state.night); });
        resetBtn.addEventListener("click", function () {
            state = { stars: 0, eggs: 0, night: false };
            lastMilestone = 0;
            save();
            updateStats();
            setNight(false);
            field.querySelectorAll(".animal").forEach(function (b) { b.classList.remove("hungry"); });
            seed = 1;
            field.querySelectorAll(".animal").forEach(function (btn) {
                if (rnd() < 0.35) btn.classList.add("hungry");
            });
            toast("Granja reiniciada 🌱");
        });

        startBtn.addEventListener("click", function () {
            intro.classList.add("hide");
            setTimeout(function () { intro.style.display = "none"; }, 400);
        });

        // init
        starfield();
        buildAnimals();
        updateStats();
        setNight(!!state.night);
        lastMilestone = Math.floor(state.stars / 10) * 10;
    })();
    </script>
</body>
